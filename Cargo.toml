[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Matthew Wilding <mbwilding@gmail.com>"]
repository = "https://github.com/mbwilding/tiling"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
tiling-core = { path = "crates/tiling-core" }
tiling-config = { path = "crates/tiling-config" }
tiling-ipc = { path = "crates/tiling-ipc" }
tiling-platform = { path = "crates/tiling-platform" }

anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "6"
interprocess = { version = "2.4", features = ["tokio"] }
notify = "8.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "signal"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
uiautomation = "0.25"
win-hotkeys = "0.5"
wineventhook = "0.11"
winsafe = { version = "0.0.29", features = ["user", "dwm", "kernel", "gdi", "gui"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
