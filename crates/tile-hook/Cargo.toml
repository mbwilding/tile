[package]
name = "tile-hook"
description = "Low-level keyboard hooks and key injection for Tile: its only unsafe code"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The COM and WinRT interfaces behind the launcher's volume, network, Wi-Fi and Bluetooth items.
windows = { workspace = true, features = [
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
] }

# Not the workspace lints: this crate is where `unsafe` is allowed. Every block says why it
# is sound in a `// SAFETY:` comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
