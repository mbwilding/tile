[package]
name = "tilectl"
description = "Command-line control for Tile"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tile-config.workspace = true
tile-core.workspace = true
tile-ipc.workspace = true
interprocess.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "io-util"] }
# Registry, UAC and Task Scheduler, for `install` (the workspace entry enables much more).
winsafe = { version = "0.0.29", default-features = false, features = ["advapi", "shell", "taskschd"] }

[lints]
workspace = true
