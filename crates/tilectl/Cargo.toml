[package]
name = "tilectl"
description = "Command-line control for Tile"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tile-core.workspace = true
tile-ipc.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Only the registry, for `install` (the workspace entry enables much more).
winsafe = { version = "0.0.29", default-features = false, features = ["advapi"] }

[lints]
workspace = true
