# tiling — default configuration.
# Copied to %APPDATA%\tiling\config.toml on first run. Saved changes are applied live.

[general]
# Gap between windows / between windows and the monitor edge, in pixels.
gaps_in = 5
gaps_out = 10
# dwindle | master | monocle | scrolling
layout = "dwindle"
# Colored focus borders (Windows 11 only).
borders = true
border_active = "#89b4fa"
border_inactive = "#45475a"
# Give focus to newly opened windows.
focus_new_windows = true
# Title bars on tiled windows. When false, they're removed from tiled windows (floating
# windows keep them so they can still be dragged) and restored when tiling exits or crashes.
# Apps that draw their own title bar (Terminal, browsers, VS Code) are unaffected.
decorations = true

[animations]
enabled = true
duration_ms = 150
# Cubic bezier control points (x1, y1, x2, y2), like Hyprland's `bezier`.
bezier = [0.05, 0.9, 0.1, 1.0]

[dwindle]
split_ratio = 0.5

[master]
mfact = 0.55
count = 1
new_is_master = false

[scrolling]
# Width of new columns as a fraction of the monitor.
proportion = 0.5
# Widths cycled through by `cycleproportion`.
proportion_presets = [0.333, 0.5, 0.667, 1.0]
# always | on_overflow | never
center_focused = "on_overflow"

# Keybinds: "<modifiers>+<key>" = "<dispatcher> [args]".
# Modifiers: super (Win), shift, ctrl, alt. Win+L is reserved by Windows and cannot be bound.
[binds]
"super+enter" = "exec wt.exe"
"super+q" = "killactive"
"super+v" = "togglefloating"
"super+f" = "fullscreen"
"super+space" = "cyclelayout"

"super+left" = "movefocus l"
"super+right" = "movefocus r"
"super+up" = "movefocus u"
"super+down" = "movefocus d"

"super+shift+left" = "movewindow l"
"super+shift+right" = "movewindow r"
"super+shift+up" = "movewindow u"
"super+shift+down" = "movewindow d"

"super+alt+left" = "resizeactive -40 0"
"super+alt+right" = "resizeactive 40 0"
"super+alt+up" = "resizeactive 0 -40"
"super+alt+down" = "resizeactive 0 40"

# Native virtual desktops. Win+Ctrl+Left/Right, Win+Ctrl+D and Win+Tab are left to Windows;
# each desktop has its own set of tiling workspaces.
"super+ctrl+shift+left" = "movetodesktop prev"
"super+ctrl+shift+right" = "movetodesktop next"
"super+ctrl+p" = "pin"

"super+comma" = "focusmonitor l"
"super+period" = "focusmonitor r"

"super+m" = "swapwithmaster"
"super+t" = "togglesplit"

"super+r" = "cycleproportion"
"super+c" = "centercolumn"
"super+bracketleft" = "consumewindow l"
"super+bracketright" = "consumewindow r"
"super+backslash" = "expelwindow"

"super+1" = "workspace 1"
"super+2" = "workspace 2"
"super+3" = "workspace 3"
"super+4" = "workspace 4"
"super+5" = "workspace 5"
"super+6" = "workspace 6"
"super+7" = "workspace 7"
"super+8" = "workspace 8"
"super+9" = "workspace 9"
"super+shift+1" = "movetoworkspace 1"
"super+shift+2" = "movetoworkspace 2"
"super+shift+3" = "movetoworkspace 3"
"super+shift+4" = "movetoworkspace 4"
"super+shift+5" = "movetoworkspace 5"
"super+shift+6" = "movetoworkspace 6"
"super+shift+7" = "movetoworkspace 7"
"super+shift+8" = "movetoworkspace 8"
"super+shift+9" = "movetoworkspace 9"

"super+shift+r" = "reload"
"super+shift+p" = "togglepause"
"super+shift+e" = "exit"

# Window rules. Matchers are case-insensitive regexes on exe, class and title; all given
# matchers must match. Actions: float, workspace, monitor (0-based index), decorations, ignore.
[[rules]]
class = "^#32770$" # standard dialogs
float = true

[[rules]]
class = "^(Windows\\.UI\\.Core\\.CoreWindow|XamlExplorerHostIslandWindow|Shell_TrayWnd)$"
ignore = true

[[rules]]
exe = "^(PowerToys.*|ShareX)\\.exe$"
ignore = true
